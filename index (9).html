<style>
:root{
  --paper:#F4F1E8; --card:#FFFDF7; --ink:#2F3A2F; --ink-2:#66705F; --line:#DCD6C4; --shadow:transparent;
  --accent:#7A9A6B; --accent-ink:#FFFFFF; --soft:#E6EDDF;
  --body-bg:#E6EDDF; --body-ink:#3F5A33; --body-dot:#7A9A6B;
  --home-bg:#F3EBD7; --home-ink:#6B5520; --home-dot:#C9A44C;
  --focus-bg:#E7E9EF; --focus-ink:#3D4766; --focus-dot:#7D8AB3;
  --chill-bg:#F6E3DA; --chill-ink:#7A3D2A; --chill-dot:#E39B7F;
  --care-bg:#F6D2BE; --care-ink:#6B3A22; --care-dot:#D98A67;
  --meal-bg:#EAF0DC; --meal-ink:#4E5E26; --meal-dot:#9DB06A;
  --good:#4F7A44; --warn:#A86A1E; --bad:#B5483B;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --text:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B201B; --card:#242A23; --ink:#ECEFE6; --ink-2:#A9B3A2; --line:#3A4238; --shadow:transparent;
    --soft:#2E362D; --accent:#8FAF7F;
    --body-bg:#2B3A27; --body-ink:#CFE3C4; --home-bg:#3A3322; --home-ink:#F0DDAE;
    --focus-bg:#2A2E3B; --focus-ink:#CBD2EA; --chill-bg:#3D2A23; --chill-ink:#F3CDBE;
    --care-bg:#45291C; --care-ink:#F6D2BE; --meal-bg:#2E3621; --meal-ink:#DCE7BD;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B201B; --card:#242A23; --ink:#ECEFE6; --ink-2:#A9B3A2; --line:#3A4238; --shadow:transparent;
    --soft:#2E362D; --accent:#8FAF7F;
    --body-bg:#2B3A27; --body-ink:#CFE3C4; --home-bg:#3A3322; --home-ink:#F0DDAE;
    --focus-bg:#2A2E3B; --focus-ink:#CBD2EA; --chill-bg:#3D2A23; --chill-ink:#F3CDBE;
    --care-bg:#45291C; --care-ink:#F6D2BE; --meal-bg:#2E3621; --meal-ink:#DCE7BD;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border:2px solid var(--line);border-radius:12px;background:var(--accent);display:grid;place-items:center;box-shadow:3px 3px 0 var(--shadow);transform:rotate(-6deg)}
.logo svg{width:24px;height:24px}
.brand h1{font-size:24px;font-weight:800}
.brand small{display:block;color:var(--ink-2);font-size:12.5px;font-weight:500}
.sync{font-size:12px;font-weight:600;padding:4px 10px;border:2px solid var(--line);border-radius:999px;background:var(--card)}
.sync.ok{color:var(--good)} .sync.saving{color:var(--warn)} .sync.err{color:var(--bad)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:4px 4px 0 var(--shadow);padding:14px}
.card h2{font-size:18px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h3{font-size:15px;font-weight:700;margin:10px 0 6px}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.btn{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-weight:600;cursor:pointer;box-shadow:2px 2px 0 var(--shadow);transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:8px}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent;text-decoration:underline}
.chip{border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--card);cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper)}
input[type=text],input[type=number],input[type=date],select,textarea{border:2px solid var(--line);border-radius:10px;background:var(--card);padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;min-height:70px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;cursor:pointer;border:2px solid var(--line);border-radius:999px;padding:4px 10px 4px 5px;background:var(--card)}
.toggle .sw{width:30px;height:18px;border-radius:999px;background:var(--soft);border:2px solid var(--line);position:relative}
.toggle .sw::after{content:"";position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;background:var(--ink);transition:left .15s}
.toggle.on .sw{background:var(--accent)} .toggle.on .sw::after{left:13px;background:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--ink-2);font-weight:700;font-size:12px;padding:4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--ink);background:var(--soft)}
@media (min-width:900px){
  nav.tabs{position:static;border:2px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--shadow);margin-bottom:16px;padding:6px;justify-content:flex-start;gap:6px}
  nav.tabs a{flex:0 0 auto;flex-direction:row;font-size:14px;padding:6px 14px}
  nav.tabs a svg{width:18px;height:18px}
  .wrap{padding-bottom:40px}
}
.daybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.daybar .date{font-family:var(--display);font-weight:800;font-size:26px}
.daybar .theme{font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;border:2px solid var(--line);background:var(--home-bg);color:var(--home-ink)}
.today-grid{display:grid;gap:16px}
@media (min-width:980px){ .today-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start} .side{position:sticky;top:12px} }
.prog{display:flex;align-items:center;gap:14px}
.ring{width:74px;height:74px;flex:0 0 auto}
.ring text{font-family:var(--display);font-weight:800;fill:var(--ink)}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.timeline{display:flex;flex-direction:column;gap:10px}
.blk{border:2px solid var(--line);border-radius:14px;background:var(--b);color:var(--i);padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;box-shadow:3px 3px 0 var(--shadow)}
.blk.done{opacity:.62}
.blk.done .bt{text-decoration:line-through}
.blk .time{font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:44px;padding-top:3px}
.blk .bt{font-weight:700;font-size:15.5px}
.blk .bs{font-size:12.5px;opacity:.9}
.blk .body{grid-column:2 / 4}
.blk.now{outline:3px dashed var(--accent);outline-offset:3px}
.c-body{--b:var(--body-bg);--i:var(--body-ink)} .c-home{--b:var(--home-bg);--i:var(--home-ink)} .c-focus{--b:var(--focus-bg);--i:var(--focus-ink)}
.c-chill{--b:var(--chill-bg);--i:var(--chill-ink)} .c-care{--b:var(--care-bg);--i:var(--care-ink)} .c-meal{--b:var(--meal-bg);--i:var(--meal-ink)}
.check{width:26px;height:26px;border:2px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;display:grid;place-items:center;padding:0;flex:0 0 auto}
.check svg{width:16px;height:16px;opacity:0}
.check.on{background:var(--ink)} .check.on svg{opacity:1;stroke:var(--paper)}
.subs{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.subs li{display:flex;align-items:center;gap:8px;font-size:14px}
.subs li .check{width:20px;height:20px;border-radius:6px}
.subs li .check svg{width:12px;height:12px}
.subs li.on span{text-decoration:line-through;opacity:.7}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;border:1.5px solid currentColor;opacity:.85;white-space:nowrap}
.expand{border:none;background:transparent;font-weight:700;font-size:12.5px;color:inherit;cursor:pointer;padding:2px 0;text-decoration:underline}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt{border:2px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--card);color:var(--ink);cursor:pointer;text-align:left;font-size:12.5px;max-width:100%}
.opt.on{background:var(--ink);color:var(--paper)}
.opt b{display:block;font-size:13px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center;font-size:13px;font-weight:600}
.bar .track{height:14px;border:2px solid var(--line);border-radius:999px;background:var(--soft);overflow:hidden;position:relative}
.bar .fill{height:100%;background:var(--accent);border-radius:999px}
.bar .plan{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.water{display:flex;gap:4px;flex-wrap:wrap}
.drop{width:24px;height:30px;border:2px solid var(--line);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:var(--card);cursor:pointer;padding:0}
.drop.on{background:var(--meal-dot)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1.5px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.list li:last-child{border-bottom:none}
.list li .grow{flex:1;min-width:0}
.list li.on .grow{text-decoration:line-through;opacity:.6}
.x{border:none;background:transparent;cursor:pointer;color:var(--ink-2);font-size:18px;line-height:1;padding:2px 6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.wcol{display:flex;flex-direction:column;gap:5px}
.whead{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:6px 8px;cursor:pointer;text-align:left;box-shadow:2px 2px 0 var(--shadow)}
.whead.today{background:var(--accent);color:var(--accent-ink)}
.whead b{font-family:var(--display);font-size:16px;display:block}
.whead span{display:block}
.wb{border-radius:8px;padding:4px 7px;font-size:11.5px;background:var(--b);color:var(--i);border:1.5px solid var(--line)}
.wb b{display:block;font-weight:700;font-size:12px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mcal .dh{font-weight:700;font-size:12px;color:var(--ink-2);text-align:center}
.mcell{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:6px 7px;min-height:88px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;font-size:11.5px;overflow:hidden;min-width:0}
.mcell.out{opacity:.38}
.mcell.today{border-color:var(--accent);box-shadow:3px 3px 0 var(--accent)}
.mcell b{font-family:var(--display);font-size:16px;line-height:1}
.mcell .pbar{display:block;height:6px;margin:0;width:100%}
.mcell .mx{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ygrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.ymon{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.ymon span{font-size:10.5px;font-weight:700;color:var(--ink-2);text-align:center}
.yd{aspect-ratio:1;border:1.5px solid var(--line);border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;display:grid;place-items:center;background:var(--card);color:var(--ink);padding:0;position:relative}
.yd.today{outline:3px solid var(--accent);outline-offset:1px}
.yd.j::after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.mtitle{border:0;background:none;padding:0;cursor:pointer;font-family:var(--display);font-weight:800;font-size:19px;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.jl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:7px}
.jl li{border-left:4px solid var(--chill-dot);padding:1px 0 1px 10px}
.prib{border:1.5px solid var(--line);border-radius:999px;background:var(--card);font-size:11.5px;font-weight:700;padding:1px 8px;cursor:pointer}
.prib.now{background:var(--accent);color:var(--accent-ink)}
.prib.someday{color:var(--ink-2);border-style:dashed}
@media (max-width:620px){.mcell{min-height:54px;padding:4px}.mcell .mx{display:none}}
.board{display:grid;gap:14px}
@media (min-width:900px){.board{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}}
.bcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.bcol h2{font-size:19px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}

.two{display:grid;gap:14px}

.spark{width:100%;height:70px}

.banner.local{background:var(--home-bg);color:var(--home-ink)}
.act{margin-top:6px}.act input{padding:3px 6px;font-size:13px}

.card{border-width:1.5px;border-radius:18px}

input[type=email],input[type=password],input:not([type]){border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:9px 11px;min-width:0}

    Object.entries(doc.actual).forEach(([id,a])=>{const st=toMin(a.s),l=dur(a);if(st==null)return;any=true;const r=acc[dt+":"+id]=acc[dt+":"+id]||{s:0,sn:0,l:0,ln:0};r.s+=st;r.sn++;if(l!=null){r.l+=l;r.ln++}});
    if(any)days[dt]++});
  timing={acc,days};if(S.view==="timing")render();
}
function sampleDate(dt){let d=todayStr();for(let i=0;i<8;i++){if(dt==="wd"?dowIdx(d)===0:dayType(d)===dt)return d;d=addDays(d,1)}return d}
function viewTiming(){
  let sec="";RAW=true;
  try{sec=[["wd","Weekdays"],["sat","Saturday"],["sun","Sunday"]].map(([dt,label])=>{
    const bl=blocksFor(sampleDate(dt)).filter(b=>b.min!=null&&b.id!=="lights"),n=(timing.days||{})[dt]||0;
    return `<div class="card"><h2>${label} <span class="tiny muted">${n} day${n===1?"":"s"} logged</span></h2><div style="overflow-x:auto"><table class="tm"><tr><th>Block</th><th>Planned start</th><th>Your usual start</th><th>Your usual length</th><th></th></tr>${bl.map(b=>{const key=dt+":"+b.id,r=(timing.acc||{})[key],av=r&&r.sn?Math.round(r.s/r.sn/5)*5:null,ln=r&&r.ln?Math.round(r.l/r.ln):null;
      return `<tr><td><b>${esc(b.id==="zone"?"Zone of the day":b.id==="hair"?"Hair wash (Mon, Wed, Fri)":b.t)}</b></td><td><input type="time" data-in="plan" data-k="${key}" value="${hm(b.min)}" aria-label="Planned start for ${esc(b.t)}"></td><td>${av!=null?fmtT(av):"–"}</td><td>${ln!=null?ln+" min":"–"}</td><td>${av!=null&&av!==b.min?`<button class="btn sm" data-act="useAvg" data-k="${key}|${hm(av)}">Use ${fmtT(av)}</button>`:""}</td></tr>`}).join("")}</table></div>
      <div class="row" style="margin-top:10px">${n?`<button class="btn sm primary" data-act="useAllAvg" data-k="${dt}">Set all to my usual times</button>`:""}<button class="btn sm ghost" data-act="resetTimes" data-k="${dt}">Reset to the original plan</button></div></div>`}).join("")}
  finally{RAW=false}
  return `<div class="grid"><div class="card"><h2>Practice week</h2><p style="margin:0;max-width:68ch">For the next week, live your day and let the app time it. On Today, tap <b>Start now</b> when you begin a block and check it off when you finish. The app saves both times, and you can fix either one by hand. After a few days, come back here: you'll see when you really start each block and how long it takes, and you can move the plan to match with one tap.</p></div>${sec}${procCard()}</div>`;
}
function procNotes(){return S.settings.procNotes||[]}
function procText(){return "Adulting HQ process changes\n"+procNotes().map(n=>`- ${n.date} · ${n.block}: ${n.text}`).join("\n")}
function procCard(){
  RAW=true;let names=[];try{names=Array.from(new Set(["wd","sat","sun"].flatMap(dt=>blocksFor(sampleDate(dt)).map(b=>b.id==="zone"?"Zone of the day":b.id==="hair"?"Hair wash":b.t))))}finally{RAW=false}
  const N=procNotes();
  return `<div class="card"><h2>Did the process change?</h2><p style="margin:0 0 10px;max-width:68ch">When a block doesn't go the way the plan says (a step moved, something got added or dropped, the order was off), write it here. Then copy the list into our chat and I'll rebuild the schedule around it.</p>
  <div class="row"><select id="pn-block" aria-label="Which block"><option>Whole day</option>${names.map(n=>`<option>${esc(n)}</option>`).join("")}</select><input type="text" id="pn-text" style="flex:1 1 240px" placeholder="I shower after the gym, not in the morning" aria-label="What changed"><button class="btn primary" data-act="addPN">Add</button></div>
  ${N.length?`<ul class="list" style="margin-top:10px">${N.map(n=>`<li><span class="grow"><b>${esc(n.block)}</b> ${esc(n.text)} <span class="tiny muted">${esc(short(n.date))}</span></span><button class="x" data-act="delPN" data-k="${n.id}" aria-label="Delete">×</button></li>`).join("")}</ul><div class="row" style="margin-top:10px"><button class="btn sm" data-act="copyPN">Copy the list for Claude</button><span class="tiny" id="copied2" role="status"></span></div>${S.open.pn?`<textarea readonly style="margin-top:8px;min-height:90px" aria-label="Process changes to copy">${esc(procText())}</textarea>`:""}`:`<div class="empty" style="margin-top:10px">No changes written down yet.</div>`}</div>`;
}
function render(){
  renderTabs();

  $("#view").innerHTML=v==="month"?viewMonth():v==="year"?viewYear():v==="body"?viewBody():v==="gym"?viewGym():v==="health"?viewHealth():v==="home"?viewHome():v==="trip"?viewTrip():v==="timing"?viewTiming():viewToday();

function route(){let h=location.hash.slice(1);if(h==="week")h="month";S.view=["today","month","year","body","gym","health","home","trip","timing"].includes(h)?h:"today"}
addEventListener("hashchange",()=>{route();if(S.view==="timing")loadTiming();render();loadView();scrollTo(0,0)});

/* ---------- actions ---------- */
function touchDay(){S.day.date=S.date;S.day.pct=progress(S.date).pct;save(dayPath())}
function stampEnd(id,on){
  if(S.date!==todayStr())return;
  S.day.actual=S.day.actual||{};const a=S.day.actual[id]=S.day.actual[id]||{};

function logShot(on){const has=(S.logs.glp1||[]).find(x=>x.date===S.date);if(on&&!has)S.logs.glp1=(S.logs.glp1||[]).concat({id:uid(),date:S.date,dose:SHOT.dose,site:nextSite()});if(!on&&has&&has.auto!==false)S.logs.glp1=(S.logs.glp1||[]).filter(x=>x!==has);save(pathOf.logs)}
function setCheck(k,on){S.day.checks=S.day.checks||{};if(on)S.day.checks[k]=true;else delete S.day.checks[k]}
document.addEventListener("click",ev=>{

    case "expand":{const b=blocksFor(S.date).find(x=>x.id===k);const cur=S.open[k]??(k===nowBlock(blocksFor(S.date)));S.open[k]=!cur;break}

    case "errand":{const e=errands().find(x=>x.id===k);if(e){e.done=!e.done;e.doneOn=e.done?S.date:null;save(pathOf.settings);if(e.done)confetti(cx0,cy0)}break}
    case "item":{const it=(S.home.items||[]).find(x=>x.id===k);if(it){it.done=!it.done;it.doneOn=it.done?S.date:null;save(pathOf.home);if(it.done)confetti(cx0,cy0)}break}
    case "start":{S.day.actual=S.day.actual||{};S.day.actual[k]=Object.assign({},S.day.actual[k],{s:nowHM()});touchDay();break}
    case "useAvg":{const [key,val]=k.split("|");S.settings.times=Object.assign({},S.settings.times,{[key]:val});save(pathOf.settings);break}
    case "useAllAvg":{const t=Object.assign({},S.settings.times);Object.entries(timing.acc||{}).forEach(([key,r])=>{if(key.startsWith(k+":")&&r.sn>0)t[key]=hm(Math.round(r.s/r.sn/5)*5)});S.settings.times=t;save(pathOf.settings);break}
    case "resetTimes":{const t=Object.assign({},S.settings.times);Object.keys(t).forEach(key=>{if(key.startsWith(k+":"))delete t[key]});S.settings.times=t;save(pathOf.settings);break}
    case "day":changeDate(addDays(S.date,+k));return;

    case "quick":{const b=blocksFor(S.date).find(x=>x.id===k);if(b){markBlock(b,true);stampEnd(k,true);touchDay();confetti(cx0,cy0)}break}
    case "addExtra":{const t=$("#x-name").value.trim(),c=parseFloat($("#x-cal").value);if(!t){$("#x-name").focus();return}if(!(c>=0)){$("#x-cal").focus();return}S.day.extra=(S.day.extra||[]).concat({id:uid(),t,cal:Math.round(c),p:Math.round(parseFloat($("#x-p").value)||0)});touchDay();break}

    case "addVitals":{const n=id=>{const v=parseFloat($("#"+id).value);return v>0?v:null};const r=n("v-rhr"),sy=n("v-sys"),di=n("v-dia"),sl=n("v-sleep");if(!r&&!sy&&!sl){$("#v-rhr").focus();return}S.logs.health=Object.assign({},S.logs.health);S.logs.health.vitals=(S.logs.health.vitals||[]).concat({id:uid(),date:$("#v-date").value||todayStr(),rhr:r,sys:sy,dia:di,sleep:sl});save(pathOf.logs);break}
    case "delVit":{S.logs.health.vitals=(S.logs.health.vitals||[]).filter(x=>x.id!==k);save(pathOf.logs);break}
    case "socDone":{const ws=weekStart(todayStr());S.logs.health=Object.assign({},S.logs.health);S.logs.health.social=Object.assign({},S.logs.health.social);const c=S.logs.health.social[ws]=Object.assign({},S.logs.health.social[ws]);c.done=!c.done;save(pathOf.logs);break}
    case "addLift":{const [id,ex]=k.split("|"),wv=parseFloat($("#lw-"+id).value),rv=parseInt($("#lr-"+id).value);if(!(rv>0)){$("#lr-"+id).focus();return}S.logs.lifts=(S.logs.lifts||[]).concat({id:uid(),date:S.date,ex,w:wv>0?wv:0,reps:rv});save(pathOf.logs);confetti(cx0,cy0);break}
    case "mood":{S.day.mood=S.day.mood===+k?null:+k;touchDay();break}
    case "makeup":{const v=k==="1";if(S.day.makeup===v)delete S.day.makeup;else S.day.makeup=v;touchDay();break}
    case "pri":{const it=homeItems().find(x=>x.id===k);if(it){it.pri=PRI[(priIdx(it)+1)%3];save(pathOf.home)}break}
    case "mnav":{if(k==="0")S.mcur=todayStr().slice(0,7);else{const y=+S.mcur.slice(0,4),m=+S.mcur.slice(5,7)-1+(+k);S.mcur=ds(new Date(y,m,1)).slice(0,7)}loadView();break}
    case "ynav":{S.ycur=k==="0"?+todayStr().slice(0,4):S.ycur+(+k);loadView();break}
    case "gomonth":{S.mcur=k;location.hash="month";return}
    case "wopen":{S.wopen[k]=!S.wopen[k];break}
    case "addPN":{const t=$("#pn-text").value.trim();if(!t){$("#pn-text").focus();return}S.settings.procNotes=procNotes().concat({id:uid(),date:todayStr(),block:$("#pn-block").value,text:t});save(pathOf.settings);break}
    case "delPN":{S.settings.procNotes=procNotes().filter(n=>n.id!==k);save(pathOf.settings);break}
    case "copyPN":{S.open.pn=true;render();const done=m=>{const e=$("#copied2");if(e)e.textContent=m};try{navigator.clipboard.writeText(procText()).then(()=>done("Copied. Paste it into our chat."),()=>done("Select the text in the box and copy it."))}catch(e){done("Select the text in the box and copy it.")}return}
    case "toggleLow":{S.day.low=!S.day.low;touchDay();break}
    case "toggleVac":{const v=vac();S.settings.vacation=Object.assign(v,{manual:!v.manual});save(pathOf.settings);break}
    case "addWeight":{const v=parseFloat($("#w-in").value);if(!(v>0)){$("#w-in").focus();return}S.logs.weights=(S.logs.weights||[]).concat({id:uid(),date:$("#w-date").value||todayStr(),lbs:Math.round(v*10)/10});save(pathOf.logs);break}
    case "delLog":{const [f,id]=k.split("|");S.logs[f]=(S.logs[f]||[]).filter(x=>x.id!==id);save(pathOf.logs);break}
    case "addMeas":{const wv=parseFloat($("#m-waist").value),hv=parseFloat($("#m-hips").value),ph=$("#m-photo").checked;if(!(wv>0)&&!(hv>0)&&!ph){$("#m-waist").focus();return}S.logs.meas=(S.logs.meas||[]).concat({id:uid(),date:$("#m-date").value||todayStr(),waist:wv>0?wv:null,hips:hv>0?hv:null,photo:ph});save(pathOf.logs);break}
    case "useBurn":{const [b,at]=k.split("|");S.logs.trueBurn=+b;S.logs.trueBurnAt=+at;save(pathOf.logs);break}
    case "resetBurn":{delete S.logs.trueBurn;delete S.logs.trueBurnAt;save(pathOf.logs);break}
    case "addProd":{const n=$("#pr-name").value.trim(),wk=parseFloat($("#pr-weeks").value),wh=$("#pr-when").value;if(!n){$("#pr-name").focus();return}if(!(wk>0)){$("#pr-weeks").focus();return}S.settings.products=prods().concat({id:uid(),name:n,cat:$("#pr-cat").value,when:wh,uses:Math.max(1,Math.round(wk*7*rate({when:wh}))),used:0,opened:todayStr()});save(pathOf.settings);break}
    case "delProd":{S.settings.products=prods().filter(x=>x.id!==k);save(pathOf.settings);break}
    case "refillProd":{const pr=prods().find(x=>x.id===k);if(pr){pr.used=0;pr.opened=todayStr();save(pathOf.settings);confetti(cx0,cy0)}break}
    case "addG":{const gd=$("#g-date").value||todayStr();S.logs.glp1=(S.logs.glp1||[]).filter(x=>x.date!==gd).concat({id:uid(),date:gd,dose:$("#g-dose").value.trim()||SHOT.dose,site:$("#g-site").value,auto:false});save(pathOf.logs);confetti(cx0,cy0);break}
    case "se":{const l=S.day.se||[];S.day.se=k==="Feel fine"?(l.includes(k)?[]:[k]):(l.includes(k)?l.filter(x=>x!==k):l.filter(x=>x!=="Feel fine").concat(k));touchDay();break}
    case "app":{S.day.appetite=S.day.appetite===k?null:k;touchDay();break}
    case "weed":{const v=k==="1";if(S.day.weed===v)delete S.day.weed;else S.day.weed=v;S.logs.slips=(S.logs.slips||[]).filter(x=>x.date!==S.date);if(S.day.weed===true)S.logs.slips.push({id:uid(),date:S.date});save(pathOf.logs);touchDay();break}
    case "slip":{S.day.weed=true;S.logs.slips=(S.logs.slips||[]).filter(x=>x.date!==S.date).concat({id:uid(),date:S.date});save(pathOf.logs);touchDay();break}
    case "crave":{S.logs.cravings=(S.logs.cravings||[]).concat({id:uid(),date:S.date,at:nowHM(),how:k});save(pathOf.logs);confetti(cx0,cy0);break}

    case "addPack":{const t=$("#pk-in").value.trim();if(!t)return;S.trip.packing=clone(S.trip.packing||PACKING.map(x=>({id:slug(x),t:x,done:false}))).concat({id:uid(),t,done:false});save(pathOf.trip);break}

  }

});
document.addEventListener("input",ev=>{
  const el=ev.target,f=el.dataset.in;if(!f)return;
  if(f==="top3"){S.day.top3=(S.day.top3||["","",""]).slice();S.day.top3[+el.dataset.i]=el.value;touchDay()}
  else if(f==="act"){S.day.actual=S.day.actual||{};const a=S.day.actual[el.dataset.k]=S.day.actual[el.dataset.k]||{};if(el.value)a[el.dataset.f]=el.value;else delete a[el.dataset.f];touchDay()}
  else if(f==="plan"){const t=Object.assign({},S.settings.times);if(el.value)t[el.dataset.k]=el.value;else delete t[el.dataset.k];S.settings.times=t;save(pathOf.settings)}
  else if(f==="note"){S.day.note=el.value;touchDay()}
  else if(f==="win"){S.day.win=el.value;touchDay()}
  else if(f==="hc"){const [k,fld]=el.dataset.k.split("|");S.logs.health=Object.assign({},S.logs.health);S.logs.health.checkups=Object.assign({},S.logs.health.checkups);S.logs.health.checkups[k]=Object.assign({},S.logs.health.checkups[k],{[fld]:el.value||null});save(pathOf.logs);if(el.type==="date")render()}
  else if(f==="soc"){const ws=weekStart(todayStr());S.logs.health=Object.assign({},S.logs.health);S.logs.health.social=Object.assign({},S.logs.health.social);S.logs.health.social[ws]=Object.assign({},S.logs.health.social[ws],{t:el.value});save(pathOf.logs)}
  else if(f==="quitDate"){if(el.value){S.settings.quitDate=el.value;save(pathOf.settings);render()}}
  else if(f==="wnote"){S.logs.weekNotes=Object.assign({},S.logs.weekNotes);if(el.value)S.logs.weekNotes[el.dataset.k]=el.value;else delete S.logs.weekNotes[el.dataset.k];save(pathOf.logs)}
  else if(f==="workout"){S.day.workout=el.value;touchDay()}
  else if(f==="steps"){S.day.steps=Math.max(0,parseInt(el.value)||0);touchDay()}
  else if(f==="phase"){S.logs.phase=el.value;save(pathOf.logs);render()}
  else if(f==="avgCal"){const n=parseInt(el.value);if(n>0){S.logs.avgCal=n;save(pathOf.logs)}}
  else if(f==="glpInt"){const n=parseInt(el.value);if(n>0){S.logs.glp1Interval=n;save(pathOf.logs)}}
  else if(f==="vstart"||f==="vend"){if(!el.value)return;S.settings.vacation=Object.assign(vac(),f==="vstart"?{start:el.value}:{end:el.value});save(pathOf.settings)}
  else if(f==="sitter"){S.trip.sitter=Object.assign({},S.trip.sitter,{[el.dataset.k]:el.value});save(pathOf.trip)}
});
document.addEventListener("keydown",ev=>{if(ev.key!=="Enter")return;const id=ev.target.id;const map={"pn-text":"addPN","h-text":"addItem","e-text":"addErrand","supp-in":"addSupp","pk-in":"addPack","w-in":"addWeight"};if(map[id]){ev.preventDefault();document.querySelector(`[data-act="${map[id]}"]`).click()}});
setInterval(()=>{if(S.view==="today"&&S.date===todayStr())requestRender()},60000);
{const _vh=viewHealth;viewHealth=function(){return _vh.apply(this,arguments)+`<div style="margin-top:14px">${booksCard()}</div>`};
 const _vho=viewHome;viewHome=function(){return _vho.apply(this,arguments)+`<div style="margin-top:14px">${maintCard()}</div>`};
 const _vm=viewMonth;viewMonth=function(){return _vm.apply(this,arguments)+`<div style="margin-top:14px">${maintCard("Coming up: cats, refills, hair")}</div>`};
 const _vb=viewBody;viewBody=function(){checkMiles();return _vb.apply(this,arguments)+`<div style="margin-top:14px">${milestoneCard()}</div>`};}
